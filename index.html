<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Tracker</title>
    <style>
      :root {
        --bg: #fff3f7;
        --panel: #ffffff;
        --soft: #ffe6ef;
        --primary: #f06292;
        --primary-dark: #e91e63;
        --text: #3c2b3c;
        --muted: #6e5367;
        --border: #f7d7e5;
        --danger: #ef476f;
        --danger-dark: #d7265d;
        --header-soft: #ffe7f1;
        --shadow: 0 4px 16px rgba(240, 98, 146, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1280px;
        margin: 28px auto;
        padding: 24px;
      }

      .title {
        margin: 0 0 18px;
        font-size: 2.3rem;
        text-align: center;
        color: var(--text);
      }

      .top-box {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 20px;
        margin-bottom: 24px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(170px, 1fr));
        gap: 16px;
        align-items: end;
      }

      .field {
        display: flex;
        flex-direction: column;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 7px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      select,
      input,
      button {
        border-radius: 9px;
        border: 1px solid #f3c7d8;
        font-size: 15px;
        padding: 12px 14px;
        height: 46px;
        font-family: inherit;
      }

      select,
      input {
        background: #fff;
        color: var(--text);
        outline: none;
      }

      select:focus,
      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.12);
      }

      button {
        background: var(--primary);
        color: white;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: background 0.2s ease, transform 0.12s ease;
      }

      button:hover {
        background: var(--primary-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      .sheet-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(320px, 1fr));
        gap: 20px;
      }

      .sheet {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .sheet-header {
        background: linear-gradient(135deg, #ffe9f3, #ffd9ea);
        border-bottom: 1px solid var(--border);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
      }

      .sheet-header h2 {
        margin: 0;
        font-size: 1.35rem;
        color: var(--text);
      }

      .toggle {
        font-size: 1.2rem;
        color: var(--muted);
        transition: transform 0.2s ease;
      }

      .sheet.collapsed .toggle {
        transform: rotate(-90deg);
      }

      .sheet-body {
        max-height: 1000px;
        transition: max-height 0.25s ease;
        overflow: hidden;
      }

      .sheet.collapsed .sheet-body {
        max-height: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 12px 12px;
        border-bottom: 1px solid #f8e3ee;
        font-size: 14px;
      }

      th {
        background: var(--header-soft);
        color: var(--muted);
        font-weight: 700;
      }

      td {
        background: white;
      }

      tbody tr:hover {
        background: #fff5f9;
      }

      .delete-btn {
        background: var(--danger);
        color: white;
        border: none;
        border-radius: 7px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
        height: auto;
      }

      .delete-btn:hover {
        background: var(--danger-dark);
      }

      .empty {
        padding: 18px 14px;
        color: #9a7386;
        font-style: italic;
        text-align: center;
      }

      @media (max-width: 920px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }

        .sheet-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="title">Quiz Tracker</h1>

      <div class="top-box">
        <div class="form-grid">
          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject">
              <option value="">Choose subject</option>
              <option value="Math">Math</option>
              <option value="Business">Business</option>
              <option value="Research">Research</option>
              <option value="DataAnalytics">Data Analytics</option>
            </select>
          </div>

          <div class="field">
            <label for="quizName">Quiz Number / Name</label>
            <input id="quizName" type="text" placeholder="Quiz 1 / Algebra" />
          </div>

          <div class="field">
            <label for="score">Score</label>
            <input id="score" type="number" min="0" max="100" placeholder="85" />
          </div>

          <div class="field">
            <label for="date">Date</label>
            <input id="date" type="date" />
          </div>

          <div class="field">
            <button id="addBtn">Add Entry</button>
          </div>
        </div>
      </div>

      <div class="sheet-grid">
        <div class="sheet" data-subject="Math">
          <div class="sheet-header">
            <h2>Math</h2>
            <span class="toggle">▼</span>
          </div>
          <div class="sheet-body">
            <table>
              <thead>
                <tr>
                  <th>Quiz Name</th>
                  <th>Score</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="Math"></tbody>
            </table>
            <div class="empty" id="Math-empty">No entries yet.</div>
          </div>
        </div>

        <div class="sheet" data-subject="Business">
          <div class="sheet-header">
            <h2>Business</h2>
            <span class="toggle">▼</span>
          </div>
          <div class="sheet-body">
            <table>
              <thead>
                <tr>
                  <th>Quiz Name</th>
                  <th>Score</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="Business"></tbody>
            </table>
            <div class="empty" id="Business-empty">No entries yet.</div>
          </div>
        </div>

        <div class="sheet" data-subject="Research">
          <div class="sheet-header">
            <h2>Research</h2>
            <span class="toggle">▼</span>
          </div>
          <div class="sheet-body">
            <table>
              <thead>
                <tr>
                  <th>Quiz Name</th>
                  <th>Score</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="Research"></tbody>
            </table>
            <div class="empty" id="Research-empty">No entries yet.</div>
          </div>
        </div>

        <div class="sheet" data-subject="DataAnalytics">
          <div class="sheet-header">
            <h2>Data Analytics</h2>
            <span class="toggle">▼</span>
          </div>
          <div class="sheet-body">
            <table>
              <thead>
                <tr>
                  <th>Quiz Name</th>
                  <th>Score</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="DataAnalytics"></tbody>
            </table>
            <div class="empty" id="DataAnalytics-empty">No entries yet.</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const subjects = ["Math", "Business", "Research", "DataAnalytics"];

      const subjectInput = document.getElementById("subject");
      const quizInput = document.getElementById("quizName");
      const scoreInput = document.getElementById("score");
      const dateInput = document.getElementById("date");
      const addBtn = document.getElementById("addBtn");

      function saveEntries(subject, entries) {
        localStorage.setItem(`quizEntries_${subject}`, JSON.stringify(entries));
      }

      function getEntries(subject) {
        const data = localStorage.getItem(`quizEntries_${subject}`);
        return data ? JSON.parse(data) : [];
      }

      function renderSubject(subject) {
        const tbody = document.getElementById(subject);
        const empty = document.getElementById(`${subject}-empty`);
        const entries = getEntries(subject);

        tbody.innerHTML = "";

        if (!entries.length) {
          empty.style.display = "block";
          return;
        }

        empty.style.display = "none";

        entries.forEach((entry, index) => {
          const row = document.createElement("tr");

          const quizCell = document.createElement("td");
          quizCell.textContent = entry.quiz;

          const scoreCell = document.createElement("td");
          scoreCell.textContent = entry.score;

          const dateCell = document.createElement("td");
          dateCell.textContent = entry.date;

          const actionCell = document.createElement("td");
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", () => {
            const updated = getEntries(subject);
            updated.splice(index, 1);
            saveEntries(subject, updated);
            renderSubject(subject);
          });

          actionCell.appendChild(deleteBtn);

          row.appendChild(quizCell);
          row.appendChild(scoreCell);
          row.appendChild(dateCell);
          row.appendChild(actionCell);

          tbody.appendChild(row);
        });
      }

      function renderAllSubjects() {
        subjects.forEach(renderSubject);
      }

      addBtn.addEventListener("click", () => {
        const subject = subjectInput.value.trim();
        const quiz = quizInput.value.trim();
        const score = scoreInput.value.trim();
        const date = dateInput.value;

        if (!subject || !quiz || !score || !date) {
          alert("Please fill in all fields.");
          return;
        }

        const numericScore = Number(score);
        if (Number.isNaN(numericScore) || numericScore < 0 || numericScore > 100) {
          alert("Score must be a number between 0 and 100.");
          return;
        }

        const entries = getEntries(subject);
        entries.push({ quiz, score: numericScore, date });
        saveEntries(subject, entries);

        subjectInput.value = "";
        quizInput.value = "";
        scoreInput.value = "";
        dateInput.value = "";

        renderSubject(subject);
      });

      document.querySelectorAll(".sheet-header").forEach((header) => {
        header.addEventListener("click", () => {
          const sheet = header.parentElement;
          sheet.classList.toggle("collapsed");
        });
      });

      renderAllSubjects();
    </script>
  </body>
</html>
